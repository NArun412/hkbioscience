    <div class="container py-5 h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col col-xl-5">
          <div class="card" style="border-radius: 1rem;">
            <div class="row g-0">
                <div class="col-md-6 col-lg-1 d-flex align-items-center">
                   
                  </div>
              <div class="col-md-6 col-lg-10 d-flex align-items-center">
                <div class="card-body p-4 p-lg-5 text-black">
                  <div class="text-center mb-3">
                    <a href="#!">
                      <img src="../../assets/Images/full_logo.svg" alt="BootstrapBrain Logo" width="139" height="66">
    
                    </a>
                  </div>
                  <h4 class="log-title bold text-center">Create a Strong Password</h4>
                <h6 class="_500 mb-15 text-center">Create a strong password with a mixture of letters, numbers and symbols</h6>
              <form [formGroup]="Reset_Password_Form">


                <div  class="password-container form-outline mb-4" [ngClass]="{ 'is-invalid': submitted && Reset_Password_Form_Value.New_Password.errors  }">
                    <input type="text" class="form-control form-control-lg"
                    placeholder="Enter the New Password" (keyup)="matching_last_password=false"
                    (keyup)="not_satisfy_password=false"
                    [ngClass]="{ 'is-invalid': submitted && Reset_Password_Form_Value.New_Password.errors }"
                    autocomplete="off" [type]="showNewPassword?'text':'password'"
                    formControlName="New_Password" maxlength="40">
                    <fa-icon 
                    [icon]="showNewPassword ? 'eye-slash' : 'eye'" 
                    (click)="toggleNewPasswordVisibility()" 
                    class="eye-icon" *ngIf="Reset_Password_Form.get('New_Password')?.value">
                   </fa-icon>
                   <div *ngIf="submitted && Reset_Password_Form_Value.New_Password.errors">
                    <p class="mb-0 text-danger" *ngIf="Reset_Password_Form_Value.New_Password.errors.required">New Password required</p>
                </div>
                </div>
                
                <div class="password-container form-outline mb-4" [ngClass]="{ 'is-invalid': submitted && Reset_Password_Form_Value.Confirm_Password.errors }">
                    <input type="text" class="form-control form-control-lg"
                    placeholder="Enter the Confirm Password"
                    [ngClass]="{ 'is-invalid': submitted && Reset_Password_Form_Value.Confirm_Password.errors }"
                    autocomplete="off"
                    [type]="showconfirmPassword?'text':'password'"
                    formControlName="Confirm_Password" maxlength="40">
                                                             <fa-icon 
                                                             [icon]="showconfirmPassword ? 'eye-slash' : 'eye'" 
                                                             (click)="toggleConfimPasswordVisibility()" 
                                                             class="eye-icon" *ngIf="Reset_Password_Form.get('Confirm_Password')?.value">
                                                            </fa-icon>
                                                            <div *ngIf="submitted && Reset_Password_Form_Value.Confirm_Password.errors">
                                                                <p class="mb-0 text-danger"*ngIf="Reset_Password_Form_Value.Confirm_Password.errors.required">Confirm Password required</p>
                                                                <p class="mb-0  text-danger" *ngIf="Reset_Password_Form_Value.Confirm_Password.errors.mustMatch">New Password and Confirm Password must be the same</p>
                                                            </div>
                </div>
               
                <div class="pt-1 mb-4 d-grid">
                  <button data-mdb-button-init data-mdb-ripple-init (click)="password_send()" class="btn  btn-lg btn-block btnGet " type="button">Reset Password</button>
                </div>
                <div class="col-12">
                  <div class="d-flex gap-2 justify-content-center">
                    <a href="#!" style="text-decoration: none;" routerLink="/Login">Back to Login</a>
                  </div>
                </div>                
              </form>
                 
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </section>
