<div class="form-container">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>My company name*</label>
        <input type="text" formControlName="companyName" />
      </div>
  
      <div class="form-row">
        <div class="form-group">
          <label>First Name*</label>
          <input type="text" formControlName="firstName" />
        </div>
        <div class="form-group">
          <label>Last Name*</label>
          <input type="text" formControlName="lastName" />
        </div>
      </div>
  
      <div class="form-group">
        <label>Phone number*</label>
        <input type="text" formControlName="phone" [class.error]="form.get('phone')?.invalid && form.get('phone')?.touched" />
      </div>
  
      <div class="form-group">
        <label>Email address*</label>
        <input type="email" formControlName="email" />
      </div>
  
      <div class="form-group">
        <label>Password*</label>
        <input type="password" formControlName="password" />
      </div>
  
      <div class="form-group">
        <label>Confirm Password*</label>
        <input type="password" formControlName="confirmPassword" />
      </div>
  
      <div class="form-group checkbox-group">
       <span><input type="checkbox" formControlName="agreeTerms" /> I have read and agree to the Terms & Conditions</span> 
      </div>
  
      <div class="form-group checkbox-group">
       
        <label>I'd like to receive electronic communications.</label>
      </div>
  
      <button type="submit" class="submit-btn" [disabled]="form.invalid">Submit</button>
    </form>
</div>
