<div class="container py-4 d-flex justify-content-center custom-stepper-wrapper p-3 rounded">
  <form [formGroup]="Business_Form" class="w-100" style="max-width: 1200px;">
    <h2 class="text-center">Create Account</h2>

    <mat-horizontal-stepper class="stepper-horizontal" [linear]="true" #stepper>
      
      <mat-step [stepControl]="Business_Form">
        <form [formGroup]="Business_Form">
          <ng-template matStepLabel>Business Information</ng-template>

          <!-- Country Selection -->
          <div class="row mb-4 justify-content-start">
            <div class="col-12 col-md-6">
              <label for="country" class="form-label">Select Country</label>
              <select id="country" class="form-select" formControlName="country">
                <option value="">-- Select a Country --</option>
                <option *ngFor="let country of countries" [value]="country.code">
                  {{ country.name }}
                </option>
              </select>
            </div>
          </div>

          <!-- Business Type -->
          <div class="mb-2">
            <label class="form-label">Business Type</label>
          </div>

          <div class="row g-4 justify-content-start">
            <div 
              *ngFor="let card of cards; let i = index"
              class="col-12 col-sm-6 col-md-4 col-lg-3"
            >
              <label 
                [for]="'cardOption' + i" 
                class="card h-100 shadow-sm custom-card" 
                [class.selected-card]="selectedCardIndex === i"
              >
                <input 
                  type="radio" 
                  class="d-none" 
                  name="cardOption" 
                  [id]="'cardOption' + i"
                  [value]="card"
                  (change)="selectCard(card, i)"
                />
                <img [src]="card.image" class="card-img-top custom-img" alt="Card image" />
                <div class="card-body">
                  <h5 class="card-title">{{ card.title }}</h5>
                  <p class="card-text">{{ card.description }}</p>
                </div>
              </label>
            </div>
          </div>

          <!-- Navigation -->
          <div class="row mt-5 justify-content-center align-items-center">
            <div class="row justify-content-center">
              <button mat-button class="submit-btn" matStepperNext>Next</button>
            </div>
          </div>
        </form>
      </mat-step>

      <!-- Step 2 -->
      <mat-step>
        <ng-template matStepLabel>Personal Information</ng-template>
        <app-create-account-form></app-create-account-form>
      </mat-step>

      <!-- Step 3 -->
      <mat-step>
        <ng-template matStepLabel>Verification</ng-template>
        <app-verify-email></app-verify-email>
      </mat-step>

      <!-- Step 4 -->
      <mat-step>
        <ng-template matStepLabel>Completion</ng-template>
        <app-thank-you></app-thank-you>
      </mat-step>

    </mat-horizontal-stepper>
  </form>
</div>
