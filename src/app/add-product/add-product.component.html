<div *ngIf="isUserLoggedIn">

    <div class="container" #targetElement>
      
        <form (ngSubmit)="onSubmit()" #blogPostForm="ngForm" novalidate>
          
          <!-- Image Upload and Categories Dropdown Side by Side -->
          <div class="form-row">
            
            <!-- Image Upload -->
            <div class="form-group upload-group">
              <label for="Upload">Upload Image <span class="required">*</span></label>
              <div class="drag-drop-container"
                  
                  [class.is-invalid]="!imagePreview && blogPostForm.submitted" 
                   (dragover)="onDragOver($event)" 
                   (drop)="onDrop($event)" 
                   (click)="fileInput.click()">
                <p>Drag and drop an image here, or click to select one</p>
                <input type="file" id="fileInput" 
                required
                       (change)="onFileChange($event)" 
                       accept="image/*" 
                       #fileInput 
                       hidden 
                       
                        />
                <div *ngIf="imagePreview" class="image-preview">
                  <img [src]="imagePreview" alt="Image Preview" />
                </div>
              </div>
            </div>
            
            <!-- Categories Dropdown -->
            
          </div>
          <div class="form-row">
          <div class="form-group categories-dropdown">
            <label for="category">Category <span class="required">*</span></label>
            <select style="height:50px;" id="category" 
                    [(ngModel)]="selectedCategory.id" 
                    name="category" 
                    class="form-control"
                    required
                    [class.is-invalid]="!selectedCategory.id && blogPostForm.submitted">
              <option [ngValue]="null" [disabled]="true" >Select a category</option>
              <option *ngFor="let category of categories" [value]="category.id">{{ category.category }}</option>
            </select>
          </div>
    
          <div class="form-group pname-txt">
            <label for="pname-txt">Name <span class="required">*</span></label>  
            <input id="productname" type="text" 
            [(ngModel)]="productname" 
            name="productname" 
            style="height:50px;font-family:'Poppins-Regular';"
            class="form-control"
            placeholder="Enter"
            autocomplete="off"
            required
            maxlength="100"
            [class.is-invalid]="!productname && blogPostForm.submitted">
          </div>

          <div class="form-group subtitle-txt">
            <label for="subtitle-txt">Sub Title <span class="required">*</span></label>  
            <input id="subtitle" type="text" 
            [(ngModel)]="subtitle" 
            name="subtitle" 
            style="height:50px;font-family:'Poppins-Regular';"
            class="form-control"
            placeholder="Enter"
            autocomplete="off"
            required
            maxlength="100"
            [class.is-invalid]="!subtitle && blogPostForm.submitted">
          </div>

          <div class="form-group effective-date">
            <label for="effective-date">Effective Date</label>  
            <input type="text" 
             [(ngModel)]="selectedDate" 
             id="effective-date"
             autocomplete="off"
             [minDate]="minDate"
             name="effectiveDate"
             style="height:50px;"
             class="form-control"
             placeholder="DD/MM/YYYY"
             bsDatepicker 
             [bsConfig]="{ dateInputFormat: 'DD/MM/YYYY' }"
             (ngModelChange)="onInputChange()">
      
      <div *ngIf="!isDateValid" class="text-danger">
        Invalid date format. Please use DD/MM/YYYY.
      </div>
      <div *ngIf="!isEffDateValid && !Isedit && isDateValid" class="text-danger">
        The date must be either today or a future date.
      </div>
          </div>

          </div>
          <!-- Description Text Area -->
          <div class="form-group">
            <label for="description">Description <span class="required">*</span></label>
            <textarea #descriptionTextarea id="description" 
                      [(ngModel)]="description"
                      style="font-family:'Poppins-Regular'"
                      class="form-control Description-txt" 
                      name="description" 
                      rows="6" 
                      required
                      [class.is-invalid]="!description && blogPostForm.submitted"></textarea>
          </div>
      
          <div class="button-container">
            <button style="float: right;" class="submit-but" type="submit">
                <i class="fa-solid fa-check"></i>&nbsp; {{ Isedit ? 'Update' : 'Submit' }}
            </button>
            &nbsp;
            <button style="float: right; margin-right: 20px;" class="back-but" type="button" (click)="onCancel($event)">
              <i class="fa-solid fa-backward"></i>&nbsp; {{ Isedit ? 'Cancel' : 'Back' }}
          </button>
        </div>
        
        
          
        </form>
    
       
      </div>
      <div  #postargetElement> &nbsp;</div>
      <div> &nbsp;</div>
      <label for="category">Total Posts : {{productPosts.length}} </label>
      <div class="blog-container">
        
        <div *ngFor="let post of paginatedPosts" class="blog-post">
          <!-- Blog Image -->
              <!-- Edit and Delete Buttons -->
      
          <div class="blog-image">
            <img [src]="post.filePath" alt="Blog Image">
          </div>
      
          <!-- Blog Info -->
          <div class="blog-info">
            <div class="blog-meta">
              <div class="blog-actions">
                <button (click)="editPost(post.uploadId)" class="btn btn-edit"><i class="fa-solid fa-pen-to-square"></i>&nbsp;Edit</button>
                <button (click)="deletePost(post.uploadId)" class="btn btn-delete"><i class="fa-solid fa-trash"></i> &nbsp;Delete</button>
              </div>
              <span><i class="fa-solid fa-layer-group"></i>&nbsp;{{ post.categoryName }}</span>
              <span><i class="fa-solid fa-calendar-days"></i>&nbsp;{{ post.effectiveDateTime | date:'dd-MMM-yyyy' }}</span>
            </div>
            
          </div>
      
          <!-- Blog Title and Content -->
          <div class="blog-tc">
            <h4>{{ post.productName }}</h4>
          </div>
          <div class="blog-tc">
            <p>{{ post.subTitle }}</p>
          </div>
          <div class="blog-tc">
            <h4 [innerHTML]="getShortDescription(post)"></h4>
          </div>
    
        
        </div>
      </div>
      <div class="pagination-container">
        <button (click)="prevPage()" [disabled]="currentPage === 1">Previous</button>
        <button (click)="nextPage()" [disabled]="currentPage === totalPages">Next</button>
      </div>
    </div>
